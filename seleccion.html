
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENCIMUN | Delegaciones</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #172337;
    }

    header {
      background: #14243b;
      color: white;
      padding: 28px 7%;
    }

    header h1 { margin: 0; letter-spacing: 4px; }
    header p { color: #c5cedb; }

    main {
      max-width: 1000px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 18px #0000000b;
      margin-bottom: 22px;
    }

    h2 { margin-top: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 15px;
      background: #172d4b;
      color: white;
    }

    button:hover { background: #294b75; }
    button:disabled { cursor: not-allowed; opacity: .5; }

    .committee {
      background: white;
      color: #172337;
      border: 1px solid #d9dee6;
      text-align: left;
      min-height: 110px;
    }

    .committee strong {
      display: block;
      margin-bottom: 10px;
      font-size: 17px;
    }

    .country {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid #e1e5eb;
      padding: 14px;
      border-radius: 8px;
      margin: 9px 0;
    }

    .available { color: #24734c; font-size: 13px; }
    .reserved { color: #a33c3c; font-size: 13px; }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 16px;
      border: 1px solid #cbd2dc;
      border-radius: 7px;
      font-size: 15px;
    }

    label { font-weight: bold; font-size: 14px; }
    .hidden { display: none; }

    .secondary {
      background: #e8edf3;
      color: #172337;
      margin-bottom: 18px;
    }

    #message { margin-top: 16px; }

    footer {
      text-align: center;
      color: #687487;
      padding: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>ENCIMUN</h1>
  <p>Sistema de selección de delegaciones</p>
</header>

<main>

  <section id="committeeSection" class="panel">
    <h2>Selecciona tu comité</h2>
    <p>Elige el comité en el que deseas participar.</p>
    <div id="committees" class="grid">Cargando comités...</div>
  </section>

  <section id="countrySection" class="panel hidden">
    <button class="secondary" onclick="showCommittees()">← Volver a comités</button>
    <h2 id="committeeTitle">Países disponibles</h2>
    <p>Selecciona una delegación disponible.</p>
    <div id="countries">Cargando países...</div>
  </section>

  <section id="formSection" class="panel hidden">
    <button class="secondary" onclick="showCountries()">← Volver a países</button>
    <h2>Datos del delegado</h2>
    <p id="selection"></p>

    <form id="reservationForm">
      <label for="fullName">Nombre completo</label>
      <input id="fullName" required maxlength="120">

      <label for="school">Colegio</label>
      <input id="school" required maxlength="150">

      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required maxlength="254">

      <button type="submit" id="submitButton">
        Confirmar reservación
      </button>
    </form>

    <p id="message"></p>
  </section>

  <section id="successSection" class="panel hidden">
    <h2>Reservación confirmada</h2>
    <p id="confirmation"></p>
  </section>

</main>

<footer>ENCIMUN · Sistema de delegaciones</footer>

<script>
  // CONFIGURACIÓN DE SUPABASE
  const SUPABASE_URL = "https://tglmetohfrhwvpbukeva.supabase.co";

  // Sustituye el texto siguiente por tu clave Publishable real.
  const SUPABASE_KEY = "sb_publishable_ihiKe3oqzQ8luiABYHV1GA_rudHPorT";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let selectedCommittee = null;
  let selectedCountry = null;

  function showOnly(sectionId) {
    [
      "committeeSection",
      "countrySection",
      "formSection",
      "successSection"
    ].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });

    document.getElementById(sectionId).classList.remove("hidden");
  }

  async function loadCommittees() {
    const container = document.getElementById("committees");
    container.textContent = "Cargando comités...";

    try {
      const { data, error } = await db
        .from("committees")
        .select("id, name, expected_delegates")
        .order("id");

      if (error) throw error;

      if (!data || data.length === 0) {
        container.textContent = "No se encontraron comités.";
        return;
      }

      container.innerHTML = "";

      data.forEach(committee => {
        const button = document.createElement("button");
        button.className = "committee";

        const name = document.createElement("strong");
        name.textContent = committee.name;

        const count = document.createElement("span");
        count.textContent =
          committee.expected_delegates + " delegaciones";

        button.append(name, count);
        button.onclick = () => openCommittee(committee);

        container.appendChild(button);
      });

    } catch (error) {
      console.error("Error al cargar comités:", error);
      container.textContent =
        "No se pudieron cargar los comités: " + error.message;
    }
  }

  async function openCommittee(committee) {
    selectedCommittee = committee;

    document.getElementById("committeeTitle").textContent =
      committee.name;

    showOnly("countrySection");
    await loadCountries();
  }

  async function loadCountries() {
    const container = document.getElementById("countries");
    container.textContent = "Cargando países...";

    try {
      const { data, error } = await db.rpc("get_countries", {
        p_committee_id: selectedCommittee.id
      });

      if (error) throw error;

      container.innerHTML = "";

      data.forEach(country => {
        const row = document.createElement("div");
        row.className = "country";

        const name = document.createElement("strong");
        name.textContent = country.name;

        const status = document.createElement("span");
        const button = document.createElement("button");

        if (country.is_reserved) {
          status.className = "reserved";
          status.textContent = "Reservado";

          button.textContent = "No disponible";
          button.disabled = true;
        } else {
          status.className = "available";
          status.textContent = "Disponible";

          button.textContent = "Seleccionar";
          button.onclick = () => selectCountry(country);
        }

        row.append(name, status, button);
        container.appendChild(row);
      });

    } catch (error) {
      console.error("Error al cargar países:", error);
      container.textContent =
        "Error al cargar países: " + error.message;
    }
  }

// ACTUALIZACIÓN AUTOMÁTICA DE PAÍSES
let countryRealtimeChannel = null;

function startCountryRealtime() {
  if (countryRealtimeChannel) return;

  countryRealtimeChannel = db
    .channel("encimun-country-updates")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "country_reservation_events"
      },
      async (payload) => {
        if (
          selectedCommittee &&
          document.getElementById("countrySection") &&
          !document.getElementById("countrySection").classList.contains("hidden")
        ) {
          console.log("Nueva reservación detectada:", payload.new.country_id);
          await loadCountries();
        }
      }
    )
    .subscribe((status) => {
      console.log("Estado de actualización en vivo:", status);
    });
}

window.startCountryRealtime = startCountryRealtime;

  function selectCountry(country) {
    selectedCountry = country;

    document.getElementById("selection").textContent =
      selectedCommittee.name + " · " + country.name;

    document.getElementById("message").textContent = "";
    showOnly("formSection");
  }

  function showCommittees() {
    selectedCommittee = null;
    selectedCountry = null;
    showOnly("committeeSection");
  }

  async function showCountries() {
    selectedCountry = null;
    showOnly("countrySection");
    await loadCountries();
  }

  document.getElementById("reservationForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      if (!selectedCountry || !selectedCommittee) return;

      const button = document.getElementById("submitButton");
      const message = document.getElementById("message");

      button.disabled = true;
      button.textContent = "Confirmando...";
      message.textContent = "";

      const fullName =
        document.getElementById("fullName").value.trim();

      const school =
        document.getElementById("school").value.trim();

      const email =
        document.getElementById("email").value.trim();
        
        console.log("DATOS QUE SE ENVIARÁN:", {
       fullName,
       school,
       email,
       country: selectedCountry.name
       });
      
       try {
        const { data, error } = await db.rpc("reserve_country", {
          p_country_id: selectedCountry.id,
          p_full_name: fullName,
          p_school: school,
          p_email: email
        });

        if (error) throw error;

        if (data === "unavailable") {
          message.textContent =
            "Este país acaba de ser reservado. Selecciona otro.";

          await loadCountries();
          showOnly("countrySection");
          return;
        }

        if (data !== "reserved") {
          message.textContent =
            "Respuesta inesperada del servidor.";
          return;
        }
         sessionStorage.setItem("encimunConfirmation", JSON.stringify({
         fullName: fullName,
         school: school,
         email: email,
         committee: selectedCommittee.name,
         country: selectedCountry.name
         }));
        
         document.getElementById("confirmation").textContent =
          "Delegado: " + fullName +
          " | Colegio: " + school +
          " | Correo: " + email +
          " | Comité: " + selectedCommittee.name +
          " | País: " + selectedCountry.name;

        showOnly("successSection");

      } catch (error) {
        console.error("Error en la reservación:", error);
        message.textContent =
          "No se pudo completar la reservación: " + error.message;

      } finally {
        button.disabled = false;
        button.textContent = "Confirmar reservación";
      }
    });

  const savedConfirmation = sessionStorage.getItem("encimunConfirmation");

if (savedConfirmation) {
  const saved = JSON.parse(savedConfirmation);

  document.getElementById("confirmation").textContent =
    "Delegado: " + saved.fullName +
    " | Colegio: " + saved.school +
    " | Correo: " + saved.email +
    " | Comité: " + saved.committee +
    " | País: " + saved.country;

  showOnly("successSection");
} else {
  startCountryRealtime();
  loadCommittees();
}
</script>

</body>
</html>
